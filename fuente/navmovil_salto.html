<script>/* móvil: el reparto de Navidad con gráficos completos salta solo a la versión móvil (navm.html) */
(()=>{const movil=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=820;
 if(!movil||window.LITE||/[?&]pc=1/.test(location.search))return;
 const ir=()=>fetch('navm.html',{method:'HEAD',cache:'no-store'}).then(r=>{if(r.ok){location.replace('navm.html'+location.search+location.hash);return true}return false}).catch(()=>false);
 if(window.SOLO_NAVIDAD){ir();return}
 document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('#selzNavidad');if(!b||!e.isTrusted)return;
  e.stopImmediatePropagation();e.preventDefault();ir().then(ok=>{if(!ok)b.click()})},true);   // si no hay versión móvil al lado, sigue aquí
})();</script>
