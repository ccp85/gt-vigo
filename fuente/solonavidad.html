<style>
/* ---- GT Vigo · Edición Navideña (nav.html / navm.html sin ?desde=gt): solo el reparto, sin carrera, sin maqueta de Vigo ---- */
#portada{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#0a1030 url(portada_navidad.jpg) 50% 100%/cover no-repeat;color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(22px,5vh,60px) 20px clamp(28px,6vh,64px);
 transition:opacity .7s ease,visibility 0s linear .7s;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#portada::before{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at 50% 55%,transparent 35%,rgba(5,8,30,.55) 100%),linear-gradient(180deg,rgba(6,10,40,.55) 0%,transparent 34%,transparent 66%,rgba(6,10,40,.75) 100%)}
#portada.fuera{opacity:0;visibility:hidden;pointer-events:none}
#portada>*{position:relative}
#portada .tit{text-align:center;line-height:.86;animation:ptEntra 1.1s cubic-bezier(.2,.9,.25,1.15) both}
#portada .gt{display:block;font:400 clamp(64px,13vw,190px)/.9 "Russo One",Impact,system-ui,sans-serif;letter-spacing:.02em;
 background:linear-gradient(180deg,#fff 0%,#fff 46%,#ffe39a 54%,#f5b52e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:2px rgba(150,10,25,.9);filter:drop-shadow(0 6px 0 #9b0f1d) drop-shadow(0 14px 26px rgba(0,0,0,.55))}
#portada .gt span{background:linear-gradient(180deg,#ffe9a8 0%,#ffd24a 50%,#e99a12 100%);-webkit-background-clip:text;background-clip:text}
#portada .ed{display:inline-block;margin-top:clamp(10px,2.2vh,22px);padding:.18em .7em .24em;border-radius:999px;
 font:700 clamp(18px,3.6vw,46px)/1 "Fraunces",Georgia,serif;letter-spacing:.06em;color:#fff6dc;
 background:linear-gradient(135deg,#d01a26,#8e0f1a);box-shadow:0 0 0 3px #ffd24a inset,0 12px 30px rgba(120,0,10,.55);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#portada .ed i{font-style:normal;margin:0 .25em;color:#ffd24a}
#portada .pie{width:min(92vw,520px);text-align:center}
#portada .pb{height:12px;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,210,74,.7);overflow:hidden}
#portada .pb i{display:block;height:100%;width:0;border-radius:999px;background:repeating-linear-gradient(-45deg,#e8202e 0 12px,#fff 12px 24px);
 background-size:34px 34px;animation:ptRaya .9s linear infinite;transition:width .3s ease}
#portada .est{margin-top:10px;font:600 clamp(13px,1.6vw,16px)/1.3 "IBM Plex Sans",system-ui,sans-serif;color:#fff6dc;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#portada .copos{position:absolute;inset:-20% 0 0;pointer-events:none;
 background-image:radial-gradient(2.5px 2.5px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#fff,transparent),radial-gradient(3px 3px at 250px 160px,#fff,transparent),radial-gradient(1.6px 1.6px at 320px 40px,#fff,transparent),radial-gradient(2.2px 2.2px at 80px 210px,#fff,transparent);
 background-size:360px 260px;animation:ptNieva 9s linear infinite;opacity:.85}
@keyframes ptNieva{to{transform:translateY(260px)}}
@keyframes ptRaya{to{background-position:34px 0}}
@keyframes ptEntra{from{opacity:0;transform:scale(.8) translateY(-20px)}}
@media (orientation:portrait){#portada{background-position:46% 100%}#portada .gt{font-size:clamp(64px,21vw,160px)}#portada .ed{font-size:clamp(17px,5.4vw,40px)}}
@media (prefers-reduced-motion:reduce){#portada .copos,#portada .tit,#portada .pb i{animation:none}}
/* fuera la maqueta de Vigo, la carrera y el mundo abierto */
body.edn>header,body.edn .hint,body.edn #load,body.edn #stream,body.edn #rPrep{display:none!important}
body.edn #selCar .opt.nveh:not(.nvr){display:none!important}
</style>
<div id="portada" aria-live="polite"><div class="copos"></div>
 <div class="tit"><b class="gt">GT <span>VIGO</span></b><span class="ed"><i>★</i>EDICIÓN NAVIDEÑA<i>★</i></span></div>
 <div class="pie"><div class="pb"><i></i></div><div class="est">Encendiendo las luces de Vigo…</div></div>
</div>
<script>/* GT Vigo · Edición Navideña: portada con la ilustración durante las cargas */
(()=>{const P=document.getElementById('portada');
 if(/[?&]desde=gt/.test(location.search)){P.remove();return}   // desde el juego completo (móvil): reparto y carrera como siempre
 document.body.classList.add('edn');document.title='GT Vigo · Edición Navideña';
 const bar=P.querySelector('.pb i'),est=P.querySelector('.est');let modo='inicio',pc=0,t0=Date.now(),fuera=false;
 const FR={inicio:['Encendiendo las luces de Vigo…','Colgando los adornos de Príncipe…','Preparando las carrozas…'],juego:['Cargando los regalos en la carroza…','Enganchando los renos…','¡Despegamos hacia Vigo!']};
 const mostrar=m=>{modo=m;pc=4;t0=Date.now();fuera=false;P.classList.remove('fuera')};
 const ocultar=()=>{if(fuera)return;fuera=true;pc=100;bar.style.width='100%';setTimeout(()=>P.classList.add('fuera'),350)};
 let modoOk=false;
 setInterval(()=>{const sc=document.getElementById('selCar'),rp=document.getElementById('rPrep');
  // siempre en modo reparto (la carrera de Navidad no sale en esta edición)
  if(sc&&!sc.hidden&&!modoOk){const b=sc.querySelector('[data-modo="0"]');if(b&&!b.classList.contains('on'))b.click();modoOk=!!b}
  if(fuera)return;const dt=(Date.now()-t0)/1000;
  if(modo==='inicio'){if(sc&&!sc.hidden&&dt>1.2)return ocultar();pc+=(90-pc)*.025}
  else{if(rp&&!rp.hidden){const v=parseInt(rp.querySelector('b').textContent)||0;pc=Math.max(pc,8+v*.82)}
   if(document.body.classList.contains('rep')&&(!rp||rp.hidden)&&dt>1.5)return ocultar();
   if(dt>120)return ocultar();pc+=(94-pc)*.012}
  bar.style.width=pc.toFixed(1)+'%';const f=FR[modo];est.textContent=f[Math.min(f.length-1,Math.floor(pc/34))]},100);
 // al pulsar «¡A repartir!» vuelve la portada mientras carga Vigo
 document.addEventListener('click',e=>{const g=e.target&&e.target.closest&&e.target.closest('#selCar .go');if(g){modoOk=false;mostrar('juego')}},true);
})();</script>
